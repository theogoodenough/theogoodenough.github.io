  <div id="map" role="img" aria-label="Engraved map in the manner of an old Ordnance Survey one-inch sheet, in colour on cream paper, of a whole imagined country. Title cartouche at the top: THE PRESENT COUNTRY. A compass rose at the lower right and a scale bar in miles at the lower left. In the north-west, the moor SCROWLEMOOR, where every road converges on the town of Trendton, and the River Trend runs down from it into THE PYLE MARSHES on the west coast, where the river The Discourse winds in loops and never reaches the sea. In the south, THE FOGS, a grey stippled country with Blackpool on its coast and Hope (remains of) in Gothic lettering. At the centre, brown hachured heights with a trig point lettered Me and the town of Eye; on their south-east slope, the town of Brandtown, and below it Enville. In the north, a red ring road around the town of Wantage, lettered The Returns, and in the north-east a moor lettered WRIGHT SWYPE under wind lines. In the south-east, DELICACY, a deep gorge, a lake lettered Likemere, Virtue Beacon, and Wellness-next-the-Sea on the coast. A narrow uncoloured road lettered The Way runs up from the bottom edge through the Fogs and Brandtown and off the north-east edge."></div>
